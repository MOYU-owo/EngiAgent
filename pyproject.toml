[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "engi-agent"
version = "0.2.0"
description = "Chinese-code RC beam design, evaluation and evidence-based consultation."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langchain>=1.2,<2.0",
    "langgraph>=1.2,<2.0",
    "langchain-deepseek>=1.1,<2.0",
    "python-dotenv>=1.1,<2.0",
    "pydantic>=2.12,<3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0"]
ui = ["streamlit>=1.66,<2.0", "graphviz>=0.20,<1.0"]
ocr = ["httpx>=0.27,<1", "Pillow>=10,<13"]

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.setuptools.package-data]
engi_agent = ["ui/landing_assets/*.css", "ui/landing_assets/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
