[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "engi-agent"
version = "0.1.0"
description = "A minimal, transparent, and extensible engineering AI agent skeleton."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langchain>=1.2,<2.0",
    "langgraph>=1.2,<2.0",
    "langchain-deepseek>=1.1,<2.0",
    "python-dotenv>=1.1,<2.0",
    "pydantic>=2.12,<3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
